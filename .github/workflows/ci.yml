name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run all tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Fail if any test was skipped
        shell: python
        run: |
          import glob
          import sys
          import xml.etree.ElementTree as ET

          reports = glob.glob("target/surefire-reports/TEST-*.xml")
          if not reports:
              print("No Surefire XML reports were produced.", file=sys.stderr)
              sys.exit(1)
          skipped = []
          for report in reports:
              root = ET.parse(report).getroot()
              count = int(root.attrib.get("skipped", "0"))
              if count:
                  skipped.append((report, count))
          if skipped:
              for report, count in skipped:
                  print(f"{report}: {count} skipped test(s)", file=sys.stderr)
              sys.exit(1)
          print(f"Verified {len(reports)} test suites with no skipped tests.")

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: error

      - name: OWASP dependency scan
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::Configure the NVD_API_KEY repository secret so dependency scanning cannot be skipped."
            exit 1
          fi
          mvn --batch-mode --no-transfer-progress org.owasp:dependency-check-maven:13.0.0:check \
            -DfailBuildOnCVSS=7 -Dformat=ALL -DnvdApiKeyEnvironmentVariable=NVD_API_KEY

      - name: Upload dependency reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: target/dependency-check-report.*
          if-no-files-found: warn
