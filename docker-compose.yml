services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: feekeeper
      POSTGRES_USER: ${DB_USER:-feekeeper}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-feekeeper_dev}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - feekeeper-postgres:/var/lib/postgresql/data
volumes:
  feekeeper-postgres:
