spring:
  application:
    name: feekeeper
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/feekeeper}
    username: ${DB_USER:feekeeper}
    password: ${DB_PASSWORD:feekeeper_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: Asia/Kolkata
  flyway:
    enabled: true
server:
  error:
    include-stacktrace: never
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-must-be-at-least-32-bytes-long}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  auth-rate-limit:
    attempts: 10
    window-minutes: 1
---
spring:
  config:
    activate:
      on-profile: prod
app:
  jwt:
    secret: ${JWT_SECRET:}
---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    show-sql: false
