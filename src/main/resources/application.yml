spring:
  application:
    name: feekeeper
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/feekeeper}
    username: ${DB_USER:feekeeper}
    password: ${DB_PASSWORD:feekeeper_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:1MB}
      max-request-size: ${MAX_REQUEST_SIZE:1MB}
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  max-http-request-header-size: ${MAX_HTTP_HEADER_SIZE:16KB}
  tomcat:
    max-http-form-post-size: ${MAX_FORM_POST_SIZE:1MB}
    max-swallow-size: ${MAX_SWALLOW_SIZE:1MB}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true
info:
  app:
    name: FeeKeeper
    version: ${APP_VERSION:development}
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-must-be-at-least-32-bytes-long}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  auth-rate-limit:
    attempts: 10
    window-minutes: 1
  request-limits:
    max-body-bytes: ${MAX_REQUEST_BODY_BYTES:1048576}
  whatsapp:
    provider: ${WHATSAPP_PROVIDER:mock}
    base-url: ${WHATSAPP_BASE_URL:http://localhost:9999}
    api-key: ${WHATSAPP_API_KEY:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    template-name: ${WHATSAPP_TEMPLATE_NAME:fee_reminder}
    language-code: ${WHATSAPP_LANGUAGE_CODE:en_IN}
    connect-timeout: ${WHATSAPP_CONNECT_TIMEOUT:3s}
    read-timeout: ${WHATSAPP_READ_TIMEOUT:10s}
    retry-attempts: ${WHATSAPP_RETRY_ATTEMPTS:3}
    retry-backoff: ${WHATSAPP_RETRY_BACKOFF:500ms}
    batch-size: ${WHATSAPP_BATCH_SIZE:100}
---
spring:
  config:
    activate:
      on-profile: prod
  lifecycle:
    timeout-per-shutdown-phase: 30s
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
server:
  shutdown: graceful
app:
  jwt:
    secret: ${JWT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  auth-rate-limit:
    attempts: ${AUTH_RATE_LIMIT_ATTEMPTS:5}
    window-minutes: ${AUTH_RATE_LIMIT_WINDOW_MINUTES:1}
---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    show-sql: false
