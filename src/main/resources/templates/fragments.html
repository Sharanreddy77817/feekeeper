<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="FeeKeeper fee management">
    <title th:text="${title + ' · FeeKeeper'}">FeeKeeper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/api.js}"></script>
</head>
<body>
<nav th:fragment="nav(active)" class="border-b border-slate-200 bg-white" aria-label="Primary navigation">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-2 px-3 py-3 sm:px-6">
        <a href="/dashboard" class="flex shrink-0 items-center gap-2 text-base font-black tracking-tight text-slate-900 sm:text-lg">
            <span class="grid h-9 w-9 place-items-center rounded-xl bg-indigo-600 text-white" aria-hidden="true">₹</span>
            FeeKeeper
        </a>
        <div class="flex shrink-0 items-center gap-0.5 rounded-xl bg-slate-100 p-1 text-xs font-semibold sm:gap-1 sm:text-sm">
            <a href="/about" class="hidden rounded-lg px-2 py-2 text-slate-600 hover:text-slate-900 sm:block sm:px-3">About Zovak</a>
            <a href="/dashboard" class="rounded-lg px-2 py-2 sm:px-3" th:classappend="${active == 'dashboard'} ? ' bg-white text-indigo-700 shadow-sm' : ' text-slate-600 hover:text-slate-900'">Dashboard</a>
            <a href="/settings" class="rounded-lg px-2 py-2 sm:px-3" th:classappend="${active == 'settings'} ? ' bg-white text-indigo-700 shadow-sm' : ' text-slate-600 hover:text-slate-900'">Settings</a>
        </div>
    </div>
</nav>

<div th:fragment="toast" id="toast" class="pointer-events-none fixed inset-x-4 top-4 z-[80] mx-auto hidden max-w-md rounded-xl px-4 py-3 text-sm font-semibold shadow-lg" role="status" aria-live="polite"></div>
</body>
</html>
