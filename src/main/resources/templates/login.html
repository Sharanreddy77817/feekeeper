<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Login')}"></head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<main class="mx-auto grid min-h-screen max-w-6xl place-items-center px-4 py-10">
    <section class="w-full max-w-md" aria-labelledby="login-title">
        <div class="mb-8 text-center">
            <div class="mx-auto mb-4 grid h-14 w-14 place-items-center rounded-2xl bg-indigo-600 text-2xl font-black text-white shadow-lg shadow-indigo-200">₹</div>
            <p class="text-sm font-bold uppercase tracking-[.2em] text-indigo-600">FeeKeeper</p>
            <h1 id="login-title" class="mt-2 text-3xl font-black tracking-tight">Welcome back</h1>
            <p class="mt-2 text-slate-600">Sign in to manage fees and reminders.</p>
        </div>
        <form id="login-form" class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-7" novalidate>
            <div class="space-y-5">
                <div><label for="email" class="mb-2 block text-sm font-bold">Email</label><input id="email" name="email" type="email" autocomplete="email" required class="focus-ring w-full rounded-xl border border-slate-300 px-4 py-3" placeholder="owner@example.com"><p data-error-for="email" class="mt-1 hidden text-sm text-red-600"></p></div>
                <div><label for="password" class="mb-2 block text-sm font-bold">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" class="focus-ring w-full rounded-xl border border-slate-300 px-4 py-3" placeholder="At least 8 characters"><p data-error-for="password" class="mt-1 hidden text-sm text-red-600"></p></div>
            </div>
            <div id="login-error" class="mt-4 hidden rounded-xl bg-red-50 p-3 text-sm font-medium text-red-700" role="alert"></div>
            <button id="login-submit" type="submit" class="focus-ring mt-6 w-full rounded-xl bg-indigo-600 px-4 py-3 font-bold text-white hover:bg-indigo-700 disabled:cursor-not-allowed disabled:opacity-60">Sign in</button>
            <p class="mt-6 text-center text-sm text-slate-600">New to FeeKeeper? <a href="/register" class="font-bold text-indigo-700 hover:underline">Create your business account</a></p>
            <p class="mt-3 text-center text-xs text-slate-500"><a href="/about" class="font-semibold text-slate-600 hover:text-indigo-600">Explore Zovak Global SaaS Features & Pricing →</a></p>
        </form>
    </section>
</main>
<div th:replace="~{fragments :: toast}"></div>
<script defer th:src="@{/js/login.js}"></script>
</body>
</html>
