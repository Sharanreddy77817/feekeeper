<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Register')}"></head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<main class="mx-auto max-w-3xl px-4 py-8 sm:py-12">
    <div class="mb-7 text-center"><a href="/login" class="inline-flex items-center gap-2 font-black text-slate-900"><span class="grid h-10 w-10 place-items-center rounded-xl bg-indigo-600 text-white">₹</span> FeeKeeper</a><h1 class="mt-5 text-3xl font-black tracking-tight">Register your business</h1><p class="mt-2 text-slate-600">Start tracking member fees in a few minutes.</p></div>
    <form id="register-form" class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-8" novalidate>
        <div class="grid gap-5 sm:grid-cols-2">
            <div><label for="businessName" class="mb-2 block text-sm font-bold">Business name</label><input id="businessName" name="businessName" maxlength="150" required class="focus-ring w-full rounded-xl border border-slate-300 px-4 py-3"><p data-error-for="businessName" class="mt-1 hidden text-sm text-red-600"></p></div>
            <div><label for="ownerName" class="mb-2 block text-sm font-bold">Owner name</label><input id="ownerName" name="ownerName" maxlength="120" required class="focus-ring w-full rounded-xl border border-slate-300 px-4 py-3"><p data-error-for="ownerName" class="mt-1 hidden text-sm text-red-600"></p></div>
            <div><label for="phone" class="mb-2 block text-sm font-bold">Mobile number</label><input id="phone" name="phone" inputmode="tel" autocomplete="tel" required pattern="(?:\+91)?[6-9][0-9]{9}" class="focus-ring w-full rounded-xl border border-slate-300 px-4 py-3" placeholder="9876543210"><p data-error-for="phone" class="mt-1 hidden text-sm text-red-600"></p></div>
            <div><label for="upiId" class="mb-2 block text-sm font-bold">UPI ID <span class="font-normal text-slate-500">(optional)</span></label><input id="upiId" name="upiId" maxlength="100" class="focus-ring w-full rounded-xl border border-slate-300 px-4 py-3" placeholder="name@bank"><p data-error-for="upiId" class="mt-1 hidden text-sm text-red-600"></p></div>
            <div><label for="email" class="mb-2 block text-sm font-bold">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required class="focus-ring w-full rounded-xl border border-slate-300 px-4 py-3"><p data-error-for="email" class="mt-1 hidden text-sm text-red-600"></p></div>
            <div><label for="password" class="mb-2 block text-sm font-bold">Password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required class="focus-ring w-full rounded-xl border border-slate-300 px-4 py-3"><p data-error-for="password" class="mt-1 hidden text-sm text-red-600"></p></div>
        </div>

        <div class="mt-8 border-t border-slate-100 pt-6">
            <div class="flex items-center justify-between mb-3">
                <div>
                    <h2 class="text-base font-black text-slate-900">Choose Your Digital Receipt Style</h2>
                    <p class="text-xs text-slate-500">Pick a Galaxy theme for digital receipts issued to your members &amp; students.</p>
                </div>
                <span class="rounded-full bg-indigo-50 px-2.5 py-1 text-[11px] font-black text-indigo-700 uppercase tracking-wider">Galaxy Edition</span>
            </div>

            <div class="grid gap-3 sm:grid-cols-3" id="theme-options">
                <!-- 1. Andromeda -->
                <label class="theme-card relative flex cursor-pointer flex-col justify-between rounded-xl border-2 border-indigo-600 bg-indigo-50/40 p-4 transition shadow-xs" data-theme="ANDROMEDA">
                    <input type="radio" name="receiptTheme" value="ANDROMEDA" checked class="sr-only">
                    <div>
                        <div class="flex items-center justify-between">
                            <span class="text-lg">🌟</span>
                            <span class="rounded-md bg-indigo-100 px-1.5 py-0.5 text-[10px] font-bold text-indigo-700">Recommended</span>
                        </div>
                        <h3 class="mt-2 text-sm font-black text-slate-900">Andromeda</h3>
                        <p class="text-[11px] font-semibold text-indigo-600">Classic Prestige</p>
                        <p class="mt-1 text-xs text-slate-600 leading-snug">Navy &amp; Emerald corporate academy style with verified desk badge.</p>
                    </div>
                    <div class="mt-3 flex items-center gap-1.5 pt-2 border-t border-slate-200/60">
                        <span class="h-3 w-3 rounded-full bg-slate-900 ring-1 ring-slate-300"></span>
                        <span class="h-3 w-3 rounded-full bg-blue-900 ring-1 ring-slate-300"></span>
                        <span class="h-3 w-3 rounded-full bg-emerald-600 ring-1 ring-slate-300"></span>
                        <span class="theme-status ml-auto text-[10px] font-bold text-indigo-600">Selected ✓</span>
                    </div>
                </label>

                <!-- 2. Nebula -->
                <label class="theme-card relative flex cursor-pointer flex-col justify-between rounded-xl border-2 border-slate-200 bg-white p-4 transition hover:border-purple-300" data-theme="NEBULA">
                    <input type="radio" name="receiptTheme" value="NEBULA" class="sr-only">
                    <div>
                        <div class="flex items-center justify-between">
                            <span class="text-lg">🚀</span>
                            <span class="rounded-md bg-purple-100 px-1.5 py-0.5 text-[10px] font-bold text-purple-700">Athletic Pass</span>
                        </div>
                        <h3 class="mt-2 text-sm font-black text-slate-900">Nebula</h3>
                        <p class="text-[11px] font-semibold text-purple-600">Cyber Fitness</p>
                        <p class="mt-1 text-xs text-slate-600 leading-snug">Cosmic Violet &amp; Neon Cyan athletic pass styling for modern gyms.</p>
                    </div>
                    <div class="mt-3 flex items-center gap-1.5 pt-2 border-t border-slate-200/60">
                        <span class="h-3 w-3 rounded-full bg-purple-950 ring-1 ring-slate-300"></span>
                        <span class="h-3 w-3 rounded-full bg-purple-600 ring-1 ring-slate-300"></span>
                        <span class="h-3 w-3 rounded-full bg-cyan-400 ring-1 ring-slate-300"></span>
                        <span class="theme-status ml-auto text-[10px] font-bold text-slate-400">Select</span>
                    </div>
                </label>

                <!-- 3. Milky Way -->
                <label class="theme-card relative flex cursor-pointer flex-col justify-between rounded-xl border-2 border-slate-200 bg-white p-4 transition hover:border-amber-300" data-theme="MILKY_WAY">
                    <input type="radio" name="receiptTheme" value="MILKY_WAY" class="sr-only">
                    <div>
                        <div class="flex items-center justify-between">
                            <span class="text-lg">✨</span>
                            <span class="rounded-md bg-amber-100 px-1.5 py-0.5 text-[10px] font-bold text-amber-800">Executive</span>
                        </div>
                        <h3 class="mt-2 text-sm font-black text-slate-900">Milky Way</h3>
                        <p class="text-[11px] font-semibold text-amber-700">Starlight Luxe</p>
                        <p class="mt-1 text-xs text-slate-600 leading-snug">Obsidian &amp; Champagne Gold luxury styling for boutique studios.</p>
                    </div>
                    <div class="mt-3 flex items-center gap-1.5 pt-2 border-t border-slate-200/60">
                        <span class="h-3 w-3 rounded-full bg-stone-900 ring-1 ring-slate-300"></span>
                        <span class="h-3 w-3 rounded-full bg-amber-600 ring-1 ring-slate-300"></span>
                        <span class="h-3 w-3 rounded-full bg-amber-400 ring-1 ring-slate-300"></span>
                        <span class="theme-status ml-auto text-[10px] font-bold text-slate-400">Select</span>
                    </div>
                </label>
            </div>
        </div>

        <div id="register-error" class="mt-5 hidden rounded-xl bg-red-50 p-3 text-sm font-medium text-red-700" role="alert"></div>
        <button id="register-submit" type="submit" class="focus-ring mt-6 w-full rounded-xl bg-indigo-600 px-4 py-3 font-bold text-white hover:bg-indigo-700 disabled:opacity-60">Create account</button>
        <p class="mt-6 text-center text-sm text-slate-600">Already registered? <a href="/login" class="font-bold text-indigo-700 hover:underline">Sign in</a></p>
        <p class="mt-3 text-center text-xs text-slate-500"><a href="/about" class="font-semibold text-slate-600 hover:text-indigo-600">Explore Zovak Global SaaS Features & Pricing →</a></p>
    </form>
</main>
<div th:replace="~{fragments :: toast}"></div>
<script defer th:src="@{/js/register.js}"></script>
</body>
</html>
