<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Settings')}"></head>
<body class="min-h-screen bg-slate-50 text-slate-900">
<nav th:replace="~{fragments :: nav('settings')}"></nav>
<main class="mx-auto max-w-3xl px-4 py-6 sm:px-6 sm:py-10">
    <header class="motion-enter mb-6"><p class="text-sm font-bold uppercase tracking-[.18em] text-indigo-600">Account</p><h1 class="mt-1 text-3xl font-black tracking-tight">Business settings</h1><p class="mt-2 text-slate-600">These details appear in reminders and receipts.</p></header>
    <div id="settings-loading" class="rounded-2xl border border-slate-200 bg-white p-8 text-center text-slate-500 shadow-sm" role="status">Loading settings…</div>
    <div id="settings-error" class="hidden rounded-2xl border border-red-200 bg-red-50 p-6 text-center text-red-800" role="alert"><p>Could not load your settings.</p><button id="retry-settings" class="mt-2 font-bold underline">Try again</button></div>
    <form id="settings-form" class="enterprise-panel hidden rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-8" novalidate>
        <div class="grid gap-5 sm:grid-cols-2">
            <div class="sm:col-span-2"><label for="businessName" class="mb-2 block text-sm font-bold">Business name</label><input id="businessName" name="businessName" maxlength="150" required class="focus-ring w-full rounded-xl border border-slate-300 px-4 py-3"><p data-error-for="businessName" class="mt-1 hidden text-sm text-red-600"></p></div>
            <div><label for="ownerName" class="mb-2 block text-sm font-bold">Owner name</label><input id="ownerName" name="ownerName" maxlength="120" required class="focus-ring w-full rounded-xl border border-slate-300 px-4 py-3"><p data-error-for="ownerName" class="mt-1 hidden text-sm text-red-600"></p></div>
            <div><label for="phone" class="mb-2 block text-sm font-bold">Phone</label><input id="phone" name="phone" inputmode="tel" required class="focus-ring w-full rounded-xl border border-slate-300 px-4 py-3"><p data-error-for="phone" class="mt-1 hidden text-sm text-red-600"></p></div>
            <div class="sm:col-span-2"><label for="upiId" class="mb-2 block text-sm font-bold">UPI ID <span class="font-normal text-slate-500">(optional)</span></label><input id="upiId" name="upiId" maxlength="100" class="focus-ring w-full rounded-xl border border-slate-300 px-4 py-3" placeholder="name@bank"><p data-error-for="upiId" class="mt-1 hidden text-sm text-red-600"></p></div>
            <div><label for="currencyCode" class="mb-2 block text-sm font-bold">Currency</label><select id="currencyCode" name="currencyCode" class="focus-ring w-full rounded-xl border border-slate-300 px-4 py-3"><option>INR</option><option>USD</option><option>EUR</option><option>GBP</option><option>AED</option></select></div>
            <div><label for="timeZone" class="mb-2 block text-sm font-bold">Time zone</label><select id="timeZone" name="timeZone" class="focus-ring w-full rounded-xl border border-slate-300 px-4 py-3"><option>Asia/Kolkata</option><option>America/New_York</option><option>Europe/London</option><option>Europe/Paris</option><option>Asia/Dubai</option></select></div>
        </div>

        <div class="mt-8 border-t border-slate-100 pt-6">
            <div class="flex items-center justify-between mb-3">
                <div>
                    <h2 class="text-base font-black text-slate-900">Digital Receipt Galaxy Theme</h2>
                    <p class="text-xs text-slate-500">Choose the design used for on-screen digital receipts, PDF downloads, and print slips.</p>
                </div>
                <span class="rounded-full bg-indigo-50 px-2.5 py-1 text-[11px] font-black text-indigo-700 uppercase tracking-wider">Galaxy Edition</span>
            </div>

            <div class="grid gap-3 sm:grid-cols-3" id="theme-options">
                <!-- 1. Andromeda -->
                <label class="theme-card relative flex cursor-pointer flex-col justify-between rounded-xl border-2 border-slate-200 bg-white p-4 transition shadow-xs" data-theme="ANDROMEDA">
                    <input type="radio" name="receiptTheme" value="ANDROMEDA" class="sr-only">
                    <div>
                        <div class="flex items-center justify-between">
                            <span class="text-lg">🌟</span>
                            <span class="rounded-md bg-indigo-100 px-1.5 py-0.5 text-[10px] font-bold text-indigo-700">Recommended</span>
                        </div>
                        <h3 class="mt-2 text-sm font-black text-slate-900">Andromeda</h3>
                        <p class="text-[11px] font-semibold text-indigo-600">Classic Prestige</p>
                        <p class="mt-1 text-xs text-slate-600 leading-snug">Deep Navy &amp; Emerald Green corporate academy layout.</p>
                    </div>
                    <div class="mt-3 flex items-center gap-1.5 pt-2 border-t border-slate-200/60">
                        <span class="h-3 w-3 rounded-full bg-slate-900 ring-1 ring-slate-300"></span>
                        <span class="h-3 w-3 rounded-full bg-blue-900 ring-1 ring-slate-300"></span>
                        <span class="h-3 w-3 rounded-full bg-emerald-600 ring-1 ring-slate-300"></span>
                        <span class="theme-status ml-auto text-[10px] font-bold text-slate-400">Select</span>
                    </div>
                </label>

                <!-- 2. Nebula -->
                <label class="theme-card relative flex cursor-pointer flex-col justify-between rounded-xl border-2 border-slate-200 bg-white p-4 transition hover:border-purple-300" data-theme="NEBULA">
                    <input type="radio" name="receiptTheme" value="NEBULA" class="sr-only">
                    <div>
                        <div class="flex items-center justify-between">
                            <span class="text-lg">🚀</span>
                            <span class="rounded-md bg-purple-100 px-1.5 py-0.5 text-[10px] font-bold text-purple-700">Athletic Pass</span>
                        </div>
                        <h3 class="mt-2 text-sm font-black text-slate-900">Nebula</h3>
                        <p class="text-[11px] font-semibold text-purple-600">Cyber Fitness</p>
                        <p class="mt-1 text-xs text-slate-600 leading-snug">Deep Violet &amp; Neon Cyan futuristic gym pass layout.</p>
                    </div>
                    <div class="mt-3 flex items-center gap-1.5 pt-2 border-t border-slate-200/60">
                        <span class="h-3 w-3 rounded-full bg-purple-950 ring-1 ring-slate-300"></span>
                        <span class="h-3 w-3 rounded-full bg-purple-600 ring-1 ring-slate-300"></span>
                        <span class="h-3 w-3 rounded-full bg-cyan-400 ring-1 ring-slate-300"></span>
                        <span class="theme-status ml-auto text-[10px] font-bold text-slate-400">Select</span>
                    </div>
                </label>

                <!-- 3. Milky Way -->
                <label class="theme-card relative flex cursor-pointer flex-col justify-between rounded-xl border-2 border-slate-200 bg-white p-4 transition hover:border-amber-300" data-theme="MILKY_WAY">
                    <input type="radio" name="receiptTheme" value="MILKY_WAY" class="sr-only">
                    <div>
                        <div class="flex items-center justify-between">
                            <span class="text-lg">✨</span>
                            <span class="rounded-md bg-amber-100 px-1.5 py-0.5 text-[10px] font-bold text-amber-800">Executive</span>
                        </div>
                        <h3 class="mt-2 text-sm font-black text-slate-900">Milky Way</h3>
                        <p class="text-[11px] font-semibold text-amber-700">Starlight Luxe</p>
                        <p class="mt-1 text-xs text-slate-600 leading-snug">Obsidian &amp; Champagne Gold luxury starlight styling.</p>
                    </div>
                    <div class="mt-3 flex items-center gap-1.5 pt-2 border-t border-slate-200/60">
                        <span class="h-3 w-3 rounded-full bg-stone-900 ring-1 ring-slate-300"></span>
                        <span class="h-3 w-3 rounded-full bg-amber-600 ring-1 ring-slate-300"></span>
                        <span class="h-3 w-3 rounded-full bg-amber-400 ring-1 ring-slate-300"></span>
                        <span class="theme-status ml-auto text-[10px] font-bold text-slate-400">Select</span>
                    </div>
                </label>
            </div>
        </div>

        <div id="settings-form-error" class="mt-5 hidden rounded-xl bg-red-50 p-3 text-sm text-red-700" role="alert"></div>
        <div class="mt-7 flex flex-col-reverse gap-3 sm:flex-row sm:items-center sm:justify-between"><button id="logout" type="button" class="focus-ring rounded-xl border border-red-200 px-5 py-3 font-bold text-red-700 hover:bg-red-50">Log out</button><button id="save-settings" class="focus-ring rounded-xl bg-indigo-600 px-5 py-3 font-bold text-white hover:bg-indigo-700 disabled:opacity-60">Save changes</button></div>
    </form>
</main>
<div th:replace="~{fragments :: toast}"></div>
<script defer th:src="@{/js/settings.js}"></script>
</body>
</html>
